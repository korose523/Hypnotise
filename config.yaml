# ============================================================================
# Universal BCI Hypnosis Depth Classification v2.1 — Global Configuration
# ============================================================================
# Naming convention:
#   prep_*.py   : Preprocessing / Feature / Label (shared prerequisite)
#   exp1xx_*.py : Offline experiments (Paper 1)
#   rt2xx_*.py  : Online real-time experiments (Paper 2)
#   utils_*.py  : Shared utility scripts (not experiments)
# ============================================================================

project:
  name: "universal_bci_hypnosis"
  version: "2.1"
  description: "Three-level hypnosis depth classification (Awake/Light/Deep) — Unified Pipeline"

# ---------------------------------------------------------------------------
# Data paths (modify to your local paths)
# ---------------------------------------------------------------------------
data_paths:
  DREAMER: "data/DREAMER/DREAMER.mat"
  DEAP: "data/DEAP/"                    # contains s01.dat ... s32.dat
  MAHNOB: "data/MAHNOB/"               # contains Sessions/
  SEED: "data/SEED/"                    # contains ExtractedFeatures/
  SEED_IV: "data/SEED_IV/"             # contains eeg_feature_smooth/
  FACED: "data/FACED/"                 # contains EEG_Features/
  ds004572: "data/ds004572/"           # BIDS format (real hypnosis)
  ds006437: "data/ds006437/"           # BIDS format (real hypnosis)

output_dir: "results"
splits_dir: "splits"
models_dir: "models"
logs_dir: "logs"
processed_dir: "processed"

# ---------------------------------------------------------------------------
# 14-channel mapping (target: Emotiv EPOC+ montage via 10-20 system)
# ---------------------------------------------------------------------------
channel_mapping:
  target_channels:
    - "AF3"
    - "F7"
    - "F3"
    - "FC5"
    - "T7"
    - "P7"
    - "O1"
    - "O2"
    - "P8"
    - "T8"
    - "FC6"
    - "F4"
    - "F8"
    - "AF4"

  DREAMER:
    mapping_type: "direct"
  DEAP:
    mapping_type: "nearest_1020"
    original_channels: ["Fp1","AF3","F3","F7","FC5","FC1","C3","T7",
                        "CP5","CP1","P3","P7","PO3","O1","Oz","Pz",
                        "Fp2","AF4","F4","F8","FC6","FC2","C4","T8",
                        "CP6","CP2","P4","P8","PO4","O2","Fz","Cz"]
  MAHNOB:
    mapping_type: "nearest_1020"
    original_channels: ["Fp1","AF3","F3","F7","FC5","FC1","C3","T7",
                        "CP5","CP1","P3","P7","PO3","O1","Oz","Pz",
                        "Fp2","AF4","Fz","F4","F8","FC6","FC2","Cz",
                        "C4","T8","CP6","CP2","P4","P8","PO4","O2"]
  SEED:
    mapping_type: "nearest_1020"
    original_channels: ["Fp1","Fpz","Fp2","AF3","AF4","F3","F4","F7",
                        "F8","FC5","FC1","FC2","FC6","T7","C3","Cz",
                        "C4","T8","CP5","CP1","CP2","CP6","P3","Pz",
                        "P4","P7","P8","PO3","PO4","O1","Oz","O2",
                        "FT7","FT8","TP7","TP8","PO7","PO8","F1","F2",
                        "F5","F6","C5","C6","C1","C2","CP3","CP4",
                        "P1","P2","P5","P6","PO5","PO6","FT9","FT10",
                        "F9","F10","TP9","TP10","P9","P10","FPz","FCz"]
  SEED_IV:
    mapping_type: "nearest_1020"
    original_channels: ["Fp1","Fpz","Fp2","AF3","AF4","F3","F4","F7",
                        "F8","FC5","FC1","FC2","FC6","T7","C3","Cz",
                        "C4","T8","CP5","CP1","CP2","CP6","P3","Pz",
                        "P4","P7","P8","PO3","PO4","O1","Oz","O2",
                        "FT7","FT8","TP7","TP8","PO7","PO8","F1","F2",
                        "F5","F6","C5","C6","C1","C2","CP3","CP4",
                        "P1","P2","P5","P6","PO5","PO6","FT9","FT10",
                        "F9","F10","TP9","TP10","P9","P10","FPz","FCz"]
  FACED:
    mapping_type: "nearest_1020"
    original_channels: ["Fp1","Fpz","Fp2","AF3","AF4","F3","F4","F7",
                        "F8","FC5","FC1","FC2","FC6","T7","C3","Cz",
                        "C4","T8","CP5","CP1","CP2","CP6","P3","Pz",
                        "P4","P7","P8","PO3","PO4","O1","Oz","O2",
                        "FT7","FT8","TP7","TP8","PO7","PO8"]
  ds004572:
    mapping_type: "nearest_1020"
    original_channels: ["Fp1","Fp2","F3","F4","C3","C4","P3","P4",
                        "O1","O2","F7","F8","T7","T8","P7","P8",
                        "Fz","Cz","Pz","Oz","AF3","AF4","FC5","FC6"]
