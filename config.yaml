# ============================================================================
# Universal BCI Hypnosis Depth Classification v2.1 — Global Configuration
# ============================================================================
# Naming convention:
#   prep_*.py   : Preprocessing / Feature / Label / Split generation
#   exp1xx_*.py : Offline experiments (Paper 1)
#   rt2xx_*.py  : Online real-time experiments (Paper 2)
#   utils_*.py  : Shared utility scripts (not experiments)
# ============================================================================

project:
  name: "universal_bci_hypnosis"
  version: "2.1"
  description: "Three-level hypnosis depth classification (Awake/Light/Deep) — Unified Pipeline"

# ---------------------------------------------------------------------------
# Data paths (modify to your local paths)
# ---------------------------------------------------------------------------
data_paths:
  DREAMER: "C:/Users/mac/Desktop/历史/DREAMER.mat"
  DEAP: "C:/Users/mac/Desktop/算法/data_preprocessed_python/"  # contains s01.dat ... s32.dat
  MAHNOB: "C:/Users/mac/Desktop/算法/Sessions/"               # contains Session directories
  SEED: "data/SEED/"                    # contains ExtractedFeatures/
  SEED_IV: "data/SEED_IV/"             # contains eeg_feature_smooth/
  FACED: "data/FACED/"                 # contains EEG_Features/
  ds004572: "data/ds004572/"           # BIDS format (real hypnosis)
  ds006437: "data/ds006437/"           # BIDS format (real hypnosis)

output_dir: "results"
splits_dir: "splits"
models_dir: "models"
logs_dir: "logs"
processed_dir: "processed"

