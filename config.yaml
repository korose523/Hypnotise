    mapping_type: "nearest_1020"
    original_channels: ["Fp1","Fp2","Fz","F3","F4","Cz","C3","C4",
                        "Pz","P3","P4","Oz","O1","O2"]

# ---------------------------------------------------------------------------
# Feature extraction (63 dimensions, feature-order locked)
# ---------------------------------------------------------------------------
# Feature vector layout (63 dims):
#   [0:42]   = 7 DASM pairs x 6 freq bands (delta,theta,alpha,beta,gamma,all)
#   [42:63]  = 21 log-bandpower (3 bands: theta,alpha,beta x 7 channels)
#   Feature order is LOCKED via FEATURE_ORDER list to prevent inconsistency.
# ---------------------------------------------------------------------------
features:
  fs_target: 128          # resample all to 128 Hz
  window_sec: 2.0         # 2s window (= 256 samples @ 128Hz)
  stride_sec: 2.0         # stride = 256 (non-overlapping for clean split)
  nperseg: 256            # Welch segment = 2s

  bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta:  [13, 30]
    gamma: [30, 45]

  # Feature order (LOCKED):
  # Block 1: DASM = logP(left) - logP(right) for 7 asymmetry pairs x 6 band definitions
  #   6 band defs: delta, theta, alpha, beta, gamma, broadband(1-45Hz)
  # Block 2: log-bandpower for theta, alpha, beta x 7 channels (AF3,F3,F7,FC5,T7,P7,O1)
  asymmetry_pairs:
    - ["AF3", "AF4"]
    - ["F3",  "F4"]
    - ["F7",  "F8"]
    - ["FC5", "FC6"]
    - ["T7",  "T8"]
    - ["P7",  "P8"]
    - ["O1",  "O2"]

  bp_channels: ["AF3", "F3", "F7", "FC5", "T7", "P7", "O1"]
  bp_bands: ["theta", "alpha", "beta"]

# ---------------------------------------------------------------------------
# Label mapping: dataset-specific -> 3-class hypnosis depth
# ---------------------------------------------------------------------------
# 0 = Awake (清醒), 1 = Light Hypnosis (浅催眠), 2 = Deep Hypnosis (深催眠)
#
# IMPORTANT distinction for reviewers:
#   ds004572 / ds006437 : TRUE hypnosis labels (depth scores, protocol phases)
#   DREAMER/DEAP/MAHNOB : PROXY labels via arousal dimension
#   SEED/SEED_IV        : PROXY labels via emotion dimension
#   FACED               : PROXY labels via arousal dimension
# ---------------------------------------------------------------------------
label_mapping:
  DREAMER:
    source_field: "arousal"
    label_type: "proxy_arousal"
    rules:
      awake: "arousal >= 4"
      light: "arousal == 3"
      deep:  "arousal <= 2"
    justification: "High arousal ~ awake state; low arousal ~ relaxed/hypnotic-like"
  DEAP:
    source_field: "arousal"
    label_type: "proxy_arousal"
    rules:
      awake: "arousal >= 7"
      light: "4 <= arousal <= 6"
      deep:  "arousal <= 3"
    justification: "Valence-arousal model: low arousal ≈ deep relaxation"
  MAHNOB:
    source_field: "arousal"
    label_type: "proxy_arousal"
    rules:
      awake: "arousal >= 7"
      light: "4 <= arousal <= 6"
      deep:  "arousal <= 3"
    justification: "Same logic as DEAP (arousal-based proxy)"
  SEED:
    source_field: "emotion"
    label_type: "proxy_emotion"
    rules:
      awake:  "emotion == 1"
      light:  "emotion == 0"
      deep:   "emotion == -1"
    justification: "Positive emotion ~ alert; negative ~ withdrawal (proxy for depth)"
  SEED_IV:
    source_field: "emotion"
    label_type: "proxy_emotion"
    rules:
      awake:  "emotion in [2, 3]"
      light:  "emotion == 0"
      deep:   "emotion == 1"
    justification: "4-class emotion mapped to 3-class hypnosis proxy"
  FACED:
    source_field: "arousal"
    label_type: "proxy_arousal"
    rules:
      awake:  "arousal >= 6.5"
      light:  "3.5 <= arousal < 6.5"
      deep:   "arousal < 3.5"
    justification: "Continuous arousal discretized to 3 levels"
  ds004572:
    source_field: "hypnosis_depth"
    label_type: "true_hypnosis"
    rules:
      awake:  "depth <= 3"
      light:  "4 <= depth <= 6"
      deep:   "depth >= 7"
    justification: "Actual hypnotic depth score (0-10) from trained hypnotherapist"
  ds006437:
    source_field: "phase"
    label_type: "true_hypnosis"
    rules:
      awake:  "phase in ['pre', 'post']"
      light:  "phase == 'during'"
      deep:   null
    justification: "Protocol phase as label; deep may not exist in this dataset"

# ---------------------------------------------------------------------------
# Model parameters
# ---------------------------------------------------------------------------
model:
  rf:
    n_estimators: 500
    max_depth: 20
    min_samples_leaf: 5
    class_weight: "balanced"
    n_jobs: -1

# ---------------------------------------------------------------------------
# Experiment parameters
# ---------------------------------------------------------------------------
experiment:
  n_seeds: 20
  seeds: [42, 123, 256, 512, 1024, 2048, 3090, 4096, 5000, 6174,
          7777, 8192, 9001, 9999, 10007, 11111, 12345, 13579, 24680, 31415]
  calib_ratios: [0, 0.01, 0.02, 0.05, 0.10, 0.20]
  default_calib_ratio: 0.20
  significance_level: 0.05
  n_bootstrap: 10000

# ---------------------------------------------------------------------------
# EEGNet parameters (for exp104 deep learning baseline)
# ---------------------------------------------------------------------------
eegnet:
  n_classes: 3
  n_channels: 14
  F1: 8               # number of temporal filters
  D: 2                # depth multiplier
  F2: 16              # number of pointwise filters
  kernel_length: 64   # temporal kernel length (samples)
  dropout_rate: 0.5
  learning_rate: 0.001
  max_epochs: 200
  batch_size: 64
  patience: 30

# ---------------------------------------------------------------------------
# EPOC+ real-time parameters (Paper 2)
# ---------------------------------------------------------------------------
epoc:
  device: "EPOC+"
  channels: 14
  fs: 128
  window_sec: 2.0       # aligned with offline
  step_sec: 2.0
  buffer_sec: 60.0
  calib_minutes: 3
  protocol:
    phases:
      - name: "awake_baseline"
        duration_sec: 180
        label: 0
        instruction: "请保持清醒放松，睁眼注视屏幕中央十字"
      - name: "light_induction"
        duration_sec: 300
        label: 1
        instruction: "请跟随语音引导，进行渐进式放松"
      - name: "deep_induction"
        duration_sec: 300
        label: 2
        instruction: "请跟随语音引导，进入更深层放松状态"
      - name: "awakening"
        duration_sec: 120
        label: 0
        instruction: "请跟随倒数，逐渐恢复清醒状态"
    subjective_rating:
      scale: [0, 10]
      prompt: "请评估刚才的催眠深度（0=完全清醒，10=极深催眠）"
      timing: "after_each_phase"
    rating_to_class:
      awake: [0, 3]     # rating 0-3 → class 0
      light: [4, 6]     # rating 4-6 → class 1
      deep:  [7, 10]    # rating 7-10 → class 2
